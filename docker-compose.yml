services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: mysql://sidra:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/sidra_academy
      REDIS_URL: redis://redis:6379
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "4000"

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "server/src/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://sidra:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/sidra_academy
      REDIS_URL: redis://redis:6379
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    expose:
      - "80"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sidra_academy
      MYSQL_USER: sidra
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u sidra -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - frontend
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.sidra-academy.rule=Host(`${SIDRA_HOSTNAME:?Set SIDRA_HOSTNAME in .env}`)"
      - "traefik.http.routers.sidra-academy.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.sidra-academy.tls=true"
      - "traefik.http.routers.sidra-academy.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.sidra-academy.service=sidra-academy"
      - "traefik.http.routers.sidra-academy-http.rule=Host(`${SIDRA_HOSTNAME:?Set SIDRA_HOSTNAME in .env}`)"
      - "traefik.http.routers.sidra-academy-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.sidra-academy-http.middlewares=sidra-academy-https-redirect"
      - "traefik.http.routers.sidra-academy-http.service=sidra-academy"
      - "traefik.http.middlewares.sidra-academy-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sidra-academy-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.sidra-academy.loadbalancer.server.port=80"

volumes:
  mysql_data:
  redis_data:

networks:
  default: {}
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}